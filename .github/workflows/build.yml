name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore from secret
        id: keystore
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP"
          KS="$RUNNER_TEMP/zomic-upload.jks"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KS"
            echo "::add-mask::${{ secrets.KEYSTORE_PASSWORD }}"
            echo "::add-mask::${{ secrets.KEYSTORE_BASE64 }}"
            echo "::add-mask::${{ secrets.KEY_PASSWORD }}"
            echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
            # Do not export passwords via GITHUB_ENV — use job env in next step
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "ks_path=$KS" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret found — falling back to debug signing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest --stacktrace

      - name: Assemble release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.ks_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease --stacktrace
          shred -u "${{ steps.keystore.outputs.ks_path }}" 2>/dev/null || rm -f "${{ steps.keystore.outputs.ks_path }}"

      - name: Commit Room schema if changed
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- app/schemas; then
            echo "Schema unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/schemas
            git commit -m "chore: update Room schema export [skip ci]"
            git push
          fi

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          SRC=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          DEST="Zomic-v${VERSION}-release.apk"
          cp "$SRC" "$DEST"
          sha256sum "$DEST" > "$DEST.sha256"
          echo "file=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zomic-apk
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          generate_release_notes: true
